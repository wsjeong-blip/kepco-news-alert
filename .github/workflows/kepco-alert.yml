name: KEPCO news alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "텔레그램 테스트 메시지 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kepco-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version:3.12
